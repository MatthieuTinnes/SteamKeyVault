# Release notes generated by git-cliff (.github/workflows/release.yml) from the
# Conventional Commits since the last version tag.
[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Merge commits ("Merge pull request #…") and gitmoji commits are not conventional.
filter_unconventional = true
split_commits = false
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
filter_commits = false
sort_commits = "oldest"

# The <!-- n --> prefix sets the section order (removed by striptags).
commit_parsers = [
    { message = "^build", skip = true },
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = ".*", group = "<!-- 4 -->Other" },
]
