<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nouveau message concernant votre clé partagée — SteamKeyVault</title>
  <style>
    body { margin:0; padding:0; background-color:#f1f5f9; font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; font-size:15px; line-height:1.6; color:#374151; -webkit-font-smoothing:antialiased; }
    .email-wrapper { padding:2rem 1rem; }
    .brand { text-align:center; margin-bottom:1.25rem; }
    .brand span { display:inline-block; font-size:1rem; font-weight:800; color:#3b82f6; letter-spacing:-0.025em; }
    .card { max-width:600px; margin:0 auto; background:#ffffff; border-radius:12px; border:1px solid #e5e7eb; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.07); }
    .card-header { background:#3b82f6; padding:1.5rem 2rem; }
    .card-header h1 { margin:0; font-size:1.15rem; font-weight:700; color:#ffffff; letter-spacing:-0.01em; }
    .card-body { padding:1.75rem 2rem; }
    .card-body p { margin:0 0 1rem; }
    .card-body p:last-child { margin-bottom:0; }
    .card-body strong { color:#111827; font-weight:600; }
    .message-block { background:#f8fafc; border:1px solid #e5e7eb; border-radius:8px; padding:1rem 1.25rem; margin:0.75rem 0; white-space:pre-wrap; font-size:0.9rem; color:#374151; }
    .card-footer { background:#f9fafb; border-top:1px solid #e5e7eb; padding:1rem 2rem; text-align:center; }
    .card-footer p { margin:0; font-size:0.75rem; color:#9ca3af; }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="brand">
      <span>🔐 SteamKeyVault</span>
    </div>
    <div class="card">
      <div class="card-header">
        <h1>Nouveau message concernant votre clé partagée</h1>
      </div>
      <div class="card-body">
        <p>Bonjour {{ donor_username }},</p>
        <p>Vous avez reçu un message au sujet de votre clé partagée pour <strong>{{ game_name }}</strong> :</p>
        <div class="message-block">{{ message }}</div>
      </div>
      <div class="card-footer">
        <p>SteamKeyVault</p>
      </div>
    </div>
  </div>
</body>
</html>
