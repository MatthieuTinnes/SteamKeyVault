<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body { font-family: Inter, Arial, sans-serif; color: #111827; }
      .container { max-width: 600px; margin: 0 auto; padding: 1.5rem; background: #ffffff; border-radius: 8px; }
      .header { font-size: 1.25rem; font-weight: 700; color: #0f172a; }
      .content { margin-top: 1rem; font-size: 1rem; color: #374151; }
      .footer { margin-top: 1.5rem; font-size: 0.9rem; color: #6b7280; }
      .alert { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 1rem; margin: 1rem 0; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">Mot de passe modifié</div>
      <div class="content">
        <p>Bonjour {{ username }},</p>
        <p>Votre mot de passe SteamKeyVault a été modifié avec succès.</p>
        <div class="alert">
          <strong>Alerte sécurité :</strong> Si vous n'êtes pas à l'origine de ce changement, contactez le support immédiatement.
        </div>
        <p>Heure du changement : {{ timestamp }}</p>
      </div>
      <div class="footer">L'équipe SteamKeyVault</div>
    </div>
  </body>
</html>
