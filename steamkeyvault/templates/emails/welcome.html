<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body { font-family: Inter, Arial, sans-serif; color: #111827; }
      .container { max-width: 600px; margin: 0 auto; padding: 1.5rem; background: #ffffff; border-radius: 8px; }
      .header { font-size: 1.25rem; font-weight: 700; color: #0f172a; }
      .content { margin-top: 1rem; font-size: 1rem; color: #374151; }
      .footer { margin-top: 1.5rem; font-size: 0.9rem; color: #6b7280; }
      .button { display:inline-block; padding: 0.6rem 1rem; background:#2563eb; color:white; border-radius:6px; text-decoration:none }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">Welcome to SteamKeyVault, {{ username }}!</div>
      <div class="content">
        <p>Thanks for creating an account on SteamKeyVault. You can now securely store and manage your Steam keys.</p>
        <p>If you didn't create this account, please ignore this email.</p>
        <p>
          <a class="button" href="{{ site_url }}">Open your vault</a>
        </p>
      </div>
      <div class="footer">SteamKeyVault Team</div>
    </div>
  </body>
</html>
