<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO -->
    <title>SteamKeyVault — Secure Steam Key Manager</title>
    <meta name="description" content="SteamKeyVault is a free, open-source vault to securely store, organize, and share your Steam game keys. End-to-end encrypted, self-hosted, no trackers.">
    <meta name="keywords" content="Steam keys, key manager, Steam key vault, game keys, secure key storage, open source, self-hosted, key organizer">
    <meta name="robots" content="index, follow">
    <meta name="author" content="SteamKeyVault">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="SteamKeyVault — Secure Steam Key Manager">
    <meta property="og:description" content="Store, organize, and share your Steam game keys securely. End-to-end encrypted, open source, and self-hosted.">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:site_name" content="SteamKeyVault">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SteamKeyVault — Secure Steam Key Manager">
    <meta name="twitter:description" content="Store, organize, and share your Steam game keys securely. End-to-end encrypted, open source, and self-hosted.">
    <meta name="twitter:image" content="/og-image.png">

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SteamKeyVault",
      "description": "A free, open-source vault to securely store, organize, and share your Steam game keys. End-to-end encrypted and self-hosted.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Web",
      "inLanguage": ["en", "fr"],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "End-to-end encryption",
        "Self-hosted",
        "Steam key organization",
        "Secure key sharing",
        "CSV and JSON import/export",
        "Open source"
      ]
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script src="/config.js"></script>
  </body>
</html>
