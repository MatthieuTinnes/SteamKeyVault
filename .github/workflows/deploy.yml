name: Build & Deploy

on:
  push:
    branches: [main, develop]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      image_tag:   ${{ steps.set-env.outputs.image_tag }}
      app_dir:     ${{ steps.set-env.outputs.app_dir }}

    steps:
      - name: Set environment variables
        id: set-env
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "image_tag=latest"       >> $GITHUB_OUTPUT
            echo "app_dir=/app/SteamKeyVault/prod" >> $GITHUB_OUTPUT
          else
            echo "environment=preprod"    >> $GITHUB_OUTPUT
            echo "image_tag=develop"      >> $GITHUB_OUTPUT
            echo "app_dir=/app/SteamKeyVault/preprod" >> $GITHUB_OUTPUT
          fi

  test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - run: pip install -r apps/backend/requirements.txt
        working-directory: apps/backend

      - name: Run tests
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: steamkeyvault.test_settings
        run: python manage.py test users steamkeyvault.games.tests steamkeyvault.keys.tests steamkeyvault.utils.tests steamkeyvault.steam.tests --verbosity=2

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: apps/frontend

      - run: pnpm run test:unit --run
        working-directory: apps/frontend

  build-backend:
    needs: [setup, test-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: apps/backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ needs.setup.outputs.image_tag }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            DEPLOY_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=backend-${{ needs.setup.outputs.environment }}
          cache-to:   type=gha,scope=backend-${{ needs.setup.outputs.environment }},mode=max

  build-frontend:
    needs: [setup, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ needs.setup.outputs.image_tag }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            DEPLOY_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=frontend-${{ needs.setup.outputs.environment }}
          cache-to:   type=gha,scope=frontend-${{ needs.setup.outputs.environment }},mode=max

  deploy:
    needs: [setup, build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Deploy backend
        uses: appleboy/ssh-action@v1
        env:
          IMAGE:   ghcr.io/${{ github.repository }}/backend:${{ needs.setup.outputs.image_tag }}
          APP_DIR: ${{ needs.setup.outputs.app_dir }}
          ACTOR:   ${{ github.actor }}
          TOKEN:   ${{ secrets.GITHUB_TOKEN }}
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          envs:     IMAGE,APP_DIR,ACTOR,TOKEN
          script: |
            echo $TOKEN | docker login ghcr.io -u $ACTOR --password-stdin
            docker pull $IMAGE
            docker compose -f $APP_DIR/docker-compose.yml up -d --no-deps --pull always backend
            docker image prune -f

      - name: Deploy frontend
        uses: appleboy/ssh-action@v1
        env:
          IMAGE:   ghcr.io/${{ github.repository }}/frontend:${{ needs.setup.outputs.image_tag }}
          APP_DIR: ${{ needs.setup.outputs.app_dir }}
          ACTOR:   ${{ github.actor }}
          TOKEN:   ${{ secrets.GITHUB_TOKEN }}
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          envs:     IMAGE,APP_DIR,ACTOR,TOKEN
          script: |
            echo $TOKEN | docker login ghcr.io -u $ACTOR --password-stdin
            docker pull $IMAGE
            docker compose -f $APP_DIR/docker-compose.yml up -d --no-deps --pull always frontend
            docker image prune -f

      - name: Notify Gotify
        if: always()
        env:
          GOTIFY_HOST: ${{ secrets.GOTIFY_HOST }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
          STATUS: ${{ job.status }}
        run: |
          curl -s -X POST "https://${GOTIFY_HOST}/message?token=${GOTIFY_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"title\": \"🚀 Deploy to ${ENVIRONMENT} — ${STATUS}\",
              \"message\": \"Commit: ${{ github.sha }}\\nAuthor: ${{ github.actor }}\\nRef: ${{ github.ref_name }}\",
              \"priority\": 5
            }"
