# .github/workflows/deploy.yml
name: Build & Deploy

on:
  push:
    branches: [main, develop]

jobs:
  # ─── Déterminer l'environnement ───────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      image_tag:   ${{ steps.set-env.outputs.image_tag }}
      app_dir:     ${{ steps.set-env.outputs.app_dir }}

    steps:
      - name: Set environment variables
        id: set-env
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "image_tag=latest"       >> $GITHUB_OUTPUT
            echo "app_dir=/app/prod" >> $GITHUB_OUTPUT
          else
            echo "environment=preprod"    >> $GITHUB_OUTPUT
            echo "image_tag=develop"      >> $GITHUB_OUTPUT
            echo "app_dir=/app/preprod"   >> $GITHUB_OUTPUT
          fi

  # ─── Build & Push ─────────────────────────────────────────────
  build:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.setup.outputs.image_tag }}
          cache-from: type=gha,scope=${{ needs.setup.outputs.environment }}
          cache-to:   type=gha,scope=${{ needs.setup.outputs.environment }},mode=max

  # ─── Deploy ───────────────────────────────────────────────────
  deploy:
    needs: [setup, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          IMAGE:   ghcr.io/${{ github.repository }}:${{ needs.setup.outputs.image_tag }}
          APP_DIR: ${{ needs.setup.outputs.app_dir }}
          ACTOR:   ${{ github.actor }}
          TOKEN:   ${{ secrets.GITHUB_TOKEN }}
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          envs:     IMAGE,APP_DIR,ACTOR,TOKEN
          script: |
            echo $TOKEN | docker login ghcr.io -u $ACTOR --password-stdin
            docker pull $IMAGE
            docker compose -f $APP_DIR/docker-compose.yml up -d --no-deps --pull always frontend
            docker image prune -f